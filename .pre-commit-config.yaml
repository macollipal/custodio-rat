default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']

  - repo: local
    hooks:
      - id: docs-inventory
        name: Custodio RAT — docs inventory (mojibake, lock files, terminologia, links)
        entry: python scripts/maintenance/docs_inventory.py --check-links
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: schema-migration-sync
        name: Schema-migration sync (requiere .sql si cambias app/models/)
        entry: python scripts/maintenance/schema_migration_sync.py
        language: system
        pass_filenames: false
        stages: [pre-commit] 
